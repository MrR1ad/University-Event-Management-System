services:
  sqldb:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: UniEventMgmt_DB
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=YourStrong@Password123
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql

  api:
    image: universityeventmanagementapi
    container_name: UniEventMgmt_API
    build:
      context: .
      dockerfile: UniversityEventManagement.Api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqldb;Database=UniEventDb;User Id=sa;Password=YourStrong@Password123;TrustServerCertificate=True;
    depends_on:
      - sqldb

volumes:
  sqldata:
